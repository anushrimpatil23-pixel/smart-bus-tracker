<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bus Live Tracking</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3448/3448339.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 1; }
        
        .header-box {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: white; padding: 10px 25px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: bold; color: #2c3e50;
        }

        .dashboard-container {
            position: absolute; bottom: 20px; left: 10px; right: 10px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 15px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }

        .info-card { text-align: center; border-right: 1px solid #eee; }
        .info-card:last-child { border-right: none; }
        .info-card b { display: block; color: #7f8c8d; font-size: 0.7rem; text-transform: uppercase; }
        .info-card span { font-size: 0.95rem; color: #2c3e50; font-weight: bold; display: block; margin-top: 3px; }
        
        .highlight { color: #e67e22 !important; }
        .location-text { color: #27ae60 !important; font-size: 0.85rem !important; }
    </style>
</head>
<body>

    <div class="header-box">🚍 Belagavi Live Tracking</div>
    <div id="map"></div>

    <div class="dashboard-container">
        <div class="info-card">
            <b>Bus No</b>
            <span id="displayBusNo">Waiting...</span>
        </div>
        <div class="info-card">
            <b>Driver</b>
            <span id="displayDriver">Waiting...</span>
        </div>
        <div class="info-card">
            <b>Route</b>
            <span id="displayRoute">Waiting...</span>
        </div>
        <div class="info-card">
            <b>Current Area</b>
            <span id="displayLocation" class="location-text">Detecting...</span>
        </div>
        <div class="info-card">
            <b>Arrival</b>
            <span id="displayEta" class="highlight">...</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://smartbustracker-25ceb-default-rtdb.firebaseio.com/",
            projectId: "smartbustracker-25ceb",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const map = L.map('map', { zoomControl: false }).setView([15.8525, 74.5061], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [40, 40],
            iconAnchor: [20, 40]
        });
        let marker = L.marker([15.8525, 74.5061], {icon: busIcon}).addTo(map);

        const TARGET_STOP = { lat: 15.8587, lng: 74.5100 };

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2-lat1)*Math.PI/180;
            const dLon = (lon2-lon1)*Math.PI/180;
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))); 
        }

        database.ref('bus_01').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if(data.latitude && data.longitude) {
                    const currentPos = [data.latitude, data.longitude];
                    marker.setLatLng(currentPos);
                    map.panTo(currentPos);
                    
                    const dist = getDistance(data.latitude, data.longitude, TARGET_STOP.lat, TARGET_STOP.lng);
                    const timeMinutes = Math.round((dist / 15) * 60); 
                    document.getElementById("displayEta").innerText = timeMinutes + " Mins";
                }

                document.getElementById("displayBusNo").innerText = data.bus_number || "Set in Admin";
                document.getElementById("displayDriver").innerText = data.driver_name || "Set in Admin";
                document.getElementById("displayRoute").innerText = data.route_name || "Set in Admin";
                document.getElementById("displayLocation").innerText = data.current_location || "Moving...";
            }
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('App Registered', reg))
                .catch(err => console.error('App Registration Failed', err));
            });
        }
    </script>
</body>
</html>
