<!DOCTYPE html>
<html>
<head>
    <title>Admin - Bus Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #ecf0f1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #7f8c8d; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 1px solid #bdc3c7; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        input:focus { outline: none; border-color: #3498db; }
        button { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>Bus Dispatch Panel</h2>
        
        <div class="input-group">
            <label>Bus Number</label>
            <input type="text" id="busNumberInput" placeholder="e.g. KA-22-B-1234">
        </div>
        
        <div class="input-group">
            <label>Driver Name</label>
            <input type="text" id="driverNameInput" placeholder="e.g. Ramesh K.">
        </div>

        <div class="input-group">
            <label>Route</label>
            <input type="text" id="routeInput" placeholder="e.g. CBT to VTU">
        </div>

        <button onclick="updateBusDetails()">Update Bus Info</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://smartbustracker-25ceb-default-rtdb.firebaseio.com/",
            projectId: "smartbustracker-25ceb",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function updateBusDetails() {
            const busNo = document.getElementById("busNumberInput").value;
            const driver = document.getElementById("driverNameInput").value;
            const route = document.getElementById("routeInput").value;

            if(!busNo || !driver || !route) {
                alert("Please fill in all fields before updating.");
                return;
            }

            // CRITICAL: Using .update() so we don't erase the live GPS data!
            database.ref('bus_01').update({
                bus_number: busNo,
                driver_name: driver,
                route_name: route
            }).then(() => {
                alert("Success! The map will now show these details.");
                // Clear the form
                document.getElementById("busNumberInput").value = "";
                document.getElementById("driverNameInput").value = "";
                document.getElementById("routeInput").value = "";
            }).catch((error) => {
                alert("Error updating database: " + error);
            });
        }
    </script>
</body>
</html>
