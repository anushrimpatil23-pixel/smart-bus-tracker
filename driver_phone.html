<!DOCTYPE html>
<html>
<head>
    <link rel="manifest" href="driver_manifest.json">
    <meta name="theme-color" content="#27ae60">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3448/3448339.png">
    <title>Driver GPS Transmitter</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3448/3448339.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #2c3e50; color: white; margin: 0; }
        h1 { font-size: 1.8rem; }
        .status-box { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; margin: 30px 0; }
        .btn { background: #27ae60; color: white; padding: 20px 30px; border-radius: 50px; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn:active { background: #219150; transform: scale(0.98); }
        #coords { font-family: monospace; color: #f1c40f; font-size: 1.1rem; margin-top: 10px; }
        #statusText { font-size: 1.2rem; margin: 10px 0; color: #2ecc71; font-weight: bold;}
    </style>
</head>
<body>
    <h1>📲 Bus GPS Tracker</h1>
    <p>Keep this screen open while driving.</p>
    
    <button class="btn" onclick="toggleTracking()" id="mainBtn">Start Live Tracking</button>

    <div class="status-box">
        <b>Current Status:</b>
        <div id="statusText">Waiting to start...</div>
        <hr style="border: 0.5px solid rgba(255,255,255,0.2); margin: 15px 0;">
        <b>Raw GPS Data:</b>
        <div id="coords">Lat: -- | Lng: --</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://smartbustracker-25ceb-default-rtdb.firebaseio.com/",
            projectId: "smartbustracker-25ceb",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let watchID = null;
        let lastGeocodeTime = 0;

        function toggleTracking() {
            const btn = document.getElementById("mainBtn");
            if (watchID === null) {
                if (navigator.geolocation) {
                    watchID = navigator.geolocation.watchPosition(sendData, handleError, {
                        enableHighAccuracy: true,
                        maximumAge: 0
                    });
                    btn.innerText = "Stop Tracking";
                    btn.style.background = "#e74c3c";
                    document.getElementById("statusText").innerText = "📡 Connecting to Satellites...";
                } else {
                    alert("Geolocation is not supported by this browser.");
                }
            } else {
                navigator.geolocation.clearWatch(watchID);
                watchID = null;
                btn.innerText = "Start Live Tracking";
                btn.style.background = "#27ae60";
                document.getElementById("statusText").innerText = "System Paused";
            }
        }

        function sendData(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            document.getElementById("coords").innerText = `Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)}`;

            let updateData = {
                latitude: lat,
                longitude: lng,
                timestamp: new Date().toLocaleTimeString()
            };

            const currentTime = Date.now();
            if (currentTime - lastGeocodeTime > 10000) {
                lastGeocodeTime = currentTime;
                
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`)
                    .then(response => response.json())
                    .then(data => {
                        const addr = data.address;
                        let localArea = addr.neighbourhood || addr.residential || addr.village || addr.suburb || addr.road || addr.hamlet || "Local Area";
                        let cityArea = addr.city || addr.town || addr.county || "";
                        let fullLocation = cityArea ? `${localArea}, ${cityArea}` : localArea;

                        document.getElementById("statusText").innerText = `📍 ${fullLocation}`;
                        updateData.current_location = fullLocation;
                        
                        database.ref('bus_01').update(updateData);
                    })
                    .catch(err => {
                        console.log("Geocoding delayed...");
                        database.ref('bus_01').update(updateData); 
                    });
            } else {
                database.ref('bus_01').update(updateData);
            }
        }

        function handleError(err) {
            alert("Error: Please enable Location/GPS access!");
            console.warn(err);
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('App Registered', reg))
                .catch(err => console.error('App Registration Failed', err));
            });
        }
    </script>
</body>
</html>
