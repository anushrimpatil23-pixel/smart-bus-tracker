<!DOCTYPE html>
<html>
<head>
    <title>Driver GPS Transmitter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #2c3e50; color: white; }
        .status-box { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; margin: 20px 0; }
        .btn { background: #27ae60; color: white; padding: 20px 40px; border-radius: 50px; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .btn:active { background: #219150; }
        #coords { font-family: monospace; color: #f1c40f; font-size: 1.1rem; }
    </style>
</head>
<body>
    <h1>📲 Bus GPS Mode</h1>
    <p>Use this page on the bus driver's phone.</p>
    
    <button class="btn" onclick="toggleTracking()" id="mainBtn">Start Live Tracking</button>

    <div class="status-box">
        <b>Current Status:</b>
        <div id="statusText">System Ready</div>
        <hr>
        <b>GPS Data:</b>
        <div id="coords">Lat: -- | Lng: --</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
    databaseURL: "https://smartbustracker-25ceb-default-rtdb.firebaseio.com/",
    projectId: "smartbustracker-25ceb",
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

let watchID = null;
let lastGeocodeTime = 0; // Timer to protect the free API

function toggleTracking() {
    const btn = document.getElementById("mainBtn");
    if (watchID === null) {
        if (navigator.geolocation) {
            watchID = navigator.geolocation.watchPosition(sendData, handleError, {
                enableHighAccuracy: true,
                maximumAge: 0
            });
            btn.innerText = "Stop Tracking";
            btn.style.background = "#e74c3c";
            document.getElementById("statusText").innerText = "📡 Connecting to Satellites...";
        }
    } else {
        navigator.geolocation.clearWatch(watchID);
        watchID = null;
        btn.innerText = "Start Live Tracking";
        btn.style.background = "#27ae60";
        document.getElementById("statusText").innerText = "System Paused";
    }
}

function sendData(position) {
    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    
    document.getElementById("coords").innerText = `Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)}`;

    // 1. Prepare the basic GPS data packet
    let updateData = {
        latitude: lat,
        longitude: lng,
        timestamp: new Date().toLocaleTimeString()
    };

    // 2. Geocoding: Convert coordinates to street name (Only once every 10 seconds)
    const currentTime = Date.now();
    if (currentTime - lastGeocodeTime > 10000) {
        lastGeocodeTime = currentTime;
        
        // Ask OpenStreetMap for the street name
        fetch// Ask OpenStreetMap for street-level details (zoom=18)
fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`)
    .then(response => response.json())
    .then(data => {
        const addr = data.address;
        
        // Smarter search: Look for hyper-local names first before falling back to roads or cities
        let localArea = addr.neighbourhood || addr.residential || addr.village || addr.suburb || addr.road || addr.hamlet || "Local Area";
        let cityArea = addr.city || addr.town || addr.county || "";
        
        // Combine them nicely
        let fullLocation = cityArea ? `${localArea}, ${cityArea}` : localArea;

        document.getElementById("statusText").innerText = `📍 ${fullLocation}`;
        
        updateData.current_location = fullLocation;
        database.ref('bus_01').update(updateData);
    })
    .catch(err => {
        console.log("Geocoding delayed...");
        database.ref('bus_01').update(updateData); 
    });
    } else {
        // If 10 seconds haven't passed, just send the GPS coordinates to keep the map moving smoothly
        database.ref('bus_01').update(updateData);
    }
}

function handleError(err) {
    alert("Error: Please enable Location/GPS on your phone!");
    console.warn(err);
}
    </script>
</body>
</html>
