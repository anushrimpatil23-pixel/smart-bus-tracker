<!DOCTYPE html>
<html>
<head>
    <title>Driver GPS Transmitter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="manifest" href="driver_manifest.json">
    <meta name="theme-color" content="#27ae60">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3448/3448339.png">
    
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #2c3e50; color: white; margin: 0; }
        h1 { font-size: 1.8rem; }
        .status-box { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; margin: 30px 0; }
        .btn { background: #27ae60; color: white; padding: 20px 30px; border-radius: 50px; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn:active { background: #219150; transform: scale(0.98); }
        #coords { font-family: monospace; color: #f1c40f; font-size: 1.1rem; margin-top: 10px; }
        #statusText { font-size: 1.2rem; margin: 10px 0; color: #2ecc71; font-weight: bold;}
    </style>
</head>
<body>
    <h1>📲 Bus GPS Tracker</h1>
    <p>Keep this screen open while driving.</p>
    
    <button class="btn" onclick="toggleTracking()" id="mainBtn">Start Live Tracking</button>

    <div class="status-box">
        <b>Current Status:</b>
        <div id="statusText">Waiting to start...</div>
        <hr style="border: 0.5px solid rgba(255,255,255,0.2); margin: 15px 0;">
        <b>Raw GPS Data:</b>
        <div id="coords">Lat: -- | Lng: -- | Acc: --</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        // 1. FIREBASE SETUP
        const firebaseConfig = {
            databaseURL: "https://smartbustracker-25ceb-default-rtdb.firebaseio.com/",
            projectId: "smartbustracker-25ceb",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let watchID = null;
        let lastGeocodeTime = 0;

        // 2. TOGGLE TRACKING ON/OFF
        function toggleTracking() {
            const btn = document.getElementById("mainBtn");
            if (watchID === null) {
                if (navigator.geolocation) {
                    // Requesting High Accuracy and setting a 10-second timeout
                    watchID = navigator.geolocation.watchPosition(sendData, handleError, {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 10000 
                    });
                    btn.innerText = "Stop Tracking";
                    btn.style.background = "#e74c3c";
                    document.getElementById("statusText").innerText = "📡 Connecting to Satellites...";
                } else {
                    alert("Geolocation is not supported by this browser.");
                }
            } else {
                navigator.geolocation.clearWatch(watchID);
                watchID = null;
                btn.innerText = "Start Live Tracking";
                btn.style.background = "#27ae60";
                document.getElementById("statusText").innerText = "System Paused";
            }
        }

        // 3. PROCESS AND SEND GPS DATA
        function sendData(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy; 
            
            // Filter: Ignore data if accuracy is worse than 1000 meters
            if (accuracy > 1000) {
                document.getElementById("statusText").innerText = `📡 Calibrating GPS... (${Math.round(accuracy)}m)`;
                return; 
            }

            // Display live coordinates and accuracy on the driver's screen
            document.getElementById("coords").innerText = `Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)} | Acc: ${Math.round(accuracy)}m`;

            let updateData = {
                latitude: lat,
                longitude: lng,
                timestamp: new Date().toLocaleTimeString()
            };

            const currentTime = Date.now();
            
            // Only ask for the street name every 10 seconds to protect the API
            if (currentTime - lastGeocodeTime > 10000) {
                lastGeocodeTime = currentTime;
                
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`)
                    .then(response => response.json())
                    .then(data => {
                        let rawAddress = data.display_name;
                        
                        if (rawAddress) {
                            // Safely split the OpenStreetMap address and take the first two most specific parts
                            let addressParts = rawAddress.split(',');
                            let fullLocation = addressParts[0].trim();
                            if (addressParts.length > 1) {
                                fullLocation += ", " + addressParts[1].trim();
                            }

                            document.getElementById("statusText").innerText = `📍 ${fullLocation}`;
                            updateData.current_location = fullLocation;
                        } else {
                            document.getElementById("statusText").innerText = `📍 Detecting Area...`;
                            updateData.current_location = "Moving...";
                        }
                        
                        // Send data to Firebase
                        database.ref('bus_01').update(updateData);
                    })
                    .catch(err => {
                        console.log("Geocoding delayed...");
                        database.ref('bus_01').update(updateData); // Send GPS even if name lookup fails
                    });
            } else {
                // If 10 seconds haven't passed, just send the GPS coordinates to keep the map moving
                database.ref('bus_01').update(updateData);
            }
        }

        function handleError(err) {
            alert("Error: Please enable Location/GPS access!");
            console.warn(err);
        }
    </script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('App Registered', reg))
                .catch(err => console.error('App Registration Failed', err));
            });
        }
    </script>
</body>
</html>
